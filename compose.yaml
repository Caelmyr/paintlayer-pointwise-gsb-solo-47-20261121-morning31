name: solo50-paintlayer
services:
  bench:
    build:
      context: .
      args:
        PAINTLAYER_DEPS_IMAGE: ${PAINTLAYER_DEPS_IMAGE:-python:3.11-slim}
    image: solo50-paintlayer:1.0
    network_mode: bridge
    ports:
      - "127.0.0.1:${PAINTLAYER_PORT:-19950}:8000"
    volumes:
      - examinations:/var/lib/paintlayer
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  examinations:
